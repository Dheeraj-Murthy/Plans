name: plans_app
description: Todoist/Linear-style Flutter task manager.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  flutter_rust_bridge: 2.12.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  alarm: ^5.5.0
  home_widget: ^0.9.2
  cupertino_icons: ^1.0.8
  google_sign_in: ^6.3.0
  http: ^1.3.0
  flutter_secure_storage: ^9.2.0
  crypto: ^3.0.6
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  uuid: ^4.5.1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
